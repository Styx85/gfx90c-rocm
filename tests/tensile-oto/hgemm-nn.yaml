GlobalParameters:
  MinimumRequiredVersion: 4.0.0
  NumElementsToValidate: 1000
  ValidationMaxToPrint: 4
  BoundsCheck: False
  KernelTime: True
  DataInitTypeAB: 3
  DataInitTypeBeta: 0
  NumBenchmarks: 5
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 5
  SleepPercent: 50
  PrintSolutionRejectionReason: False
  CMakeBuildType: Release
  CpuThreads: 4
  ShortNames: False
  MergeFiles: True
  Device: 0
  HardwareMonitor: False

BenchmarkProblems:
  - # HGEMM NN MT128x128 (oto HGEMM winner MT128x128x16 TT8x8)
    - OperationType: GEMM
      DataType: h
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - EdgeType: ["ShiftPtr"]
        - LoopTail: [True]
      ForkParameters:
        - PrefetchGlobalRead: [0, 1]
        - PrefetchLocalRead: [1]
        - ThreadTile: [[8, 8]]
        - WorkGroup: [[16, 16, 1]]
        - DepthU: [8, 16, 32]
        - VectorWidth: [-1]
        - GlobalReadVectorWidth: [-1]
        - NumLoadsCoalescedA: [1, 2]
        - NumLoadsCoalescedB: [1]
        - WorkGroupMapping: [8]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1024, 1024, 1, 1024]
          - Exact: [1365, 1365, 1, 1365]
          - Exact: [2048, 2048, 1, 2048]
          - Exact: [4096, 4096, 1, 4096]
