GlobalParameters:
  MinimumRequiredVersion: 4.0.0
  NumElementsToValidate: 1000
  ValidationMaxToPrint: 4
  BoundsCheck: False
  KernelTime: True
  DataInitTypeAB: 3
  DataInitTypeBeta: 0
  NumBenchmarks: 5
  SyncsPerBenchmark: 1
  EnqueuesPerSync: 5
  SleepPercent: 50
  PrintSolutionRejectionReason: False
  CMakeBuildType: Release
  CpuThreads: 4
  ShortNames: False
  MergeFiles: True
  Device: 0
  HardwareMonitor: False

BenchmarkProblems:
  - # fp32 TN: attention QK^T (Whisper batch 20, demucs batch 8), demucs linear layers
    - OperationType: GEMM
      DataType: s
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - EdgeType: ["ShiftPtr"]
        - LoopTail: [True]
      ForkParameters:
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - ThreadTile: [[8, 8], [6, 6], [4, 4]]
        - WorkGroup: [[16, 16, 1]]
        - DepthU: [8, 16]
        - VectorWidth: [-1]
        - GlobalReadVectorWidth: [-1]
        - NumLoadsCoalescedA: [1, 2]
        - NumLoadsCoalescedB: [1]
        - WorkGroupMapping: [8]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1500, 1500, 20, 64]
          - Exact: [2688, 2688, 8, 64]
          - Exact: [2048, 2688, 1, 512]
          - Exact: [512, 2688, 1, 2048]
  - # fp32 NN: attention PV (Whisper batch 20, demucs batch 8)
    - OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: False
      UseBeta: True
      Batched: True
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - EdgeType: ["ShiftPtr"]
        - LoopTail: [True]
      ForkParameters:
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - ThreadTile: [[8, 8], [6, 6], [4, 4]]
        - WorkGroup: [[16, 16, 1]]
        - DepthU: [8, 16]
        - VectorWidth: [-1]
        - GlobalReadVectorWidth: [-1]
        - NumLoadsCoalescedA: [1, 2]
        - NumLoadsCoalescedB: [1]
        - WorkGroupMapping: [8]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 1500, 20, 1500]
          - Exact: [64, 2688, 8, 2688]
